[project]
site_name = "LAAC-LSCP Models"
site_url = "https://laac-lscp.github.io/BabyHuBERT/"
site_description = "A Transformer based encoder model for multilingual child-centered longforms recordings."
site_author = "LAAC-LSCP"
copyright = "&copy; 2026 LAAC-LSCP, ENS-PSL"

nav = [
    { "VTC2.0" = [
        "https://laac-lscp.github.io/VTC/"
    ]},
    
    { "BabyHuBERT" = [
        {"Home" = "index.md"},
        { "Ethics" = [
            "one_pager.md",
            "flow_chart.md",
            "license.md"
        ] },
        { "Advanced" = [
            "advanced/representations.md",
        ] },
    ]},

    { "Addressee" = [
        "https://laac-lscp.github.io/addressee/"
    ]},
]

[project.theme]
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.instant",
    "navigation.path",
    "navigation.top",
    "navigation.footer",
    # "navigation.instant.preview", # experimental :/
    "toc.follow",
    "content.code.copy",
]
favicon = "assets/baby.png"
[project.theme.icon]
logo = "lucide/baby"
# logo = "assets/favicon_256.png"

[project.theme.palette]
# scheme = "slate"
primary = "blue"
accent = "blue"

[project.extra]
repo_url = "https://github.com/LAAC-LSCP/BabyHuBERT"
repo_name = "LAAC-LSCP/BabyHuBERT"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/LAAC-LSCP/BabyHuBERT"
name = "BabyHuBERT GitHub repository"

